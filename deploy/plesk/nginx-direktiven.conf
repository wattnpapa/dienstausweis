# Dienstausweis: nginx-Direktiven für die Domain in Plesk.
#
# Eintragen unter: Websites & Domains → <Domain> → „Apache & nginx Settings“
# → „Additional nginx directives“. Voraussetzung: „Proxy mode“ ist an (Vorgabe)
# und das Zertifikat kommt von SSL It! (Let's Encrypt) mit Umleitung
# http → https.
#
# Der Port muss zu DA_PLESK_PORT in .env passen (Vorgabe 8086).

location / {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Der Dienst zählt Pässe je Absender (DA_HINTER_PROXY=1).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ein Ausweis mit Foto bleibt unter 400 kB.
    client_max_body_size 1m;
}

# Anfragen an den Signierdienst tragen Ausweisdaten im Rumpf. Der steht ohnehin
# in keinem Protokoll; hier fällt auch die Zeile mit IP und Zeitpunkt weg.
location /wallet/ {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 1m;
    access_log off;
}

location /gesundheit {
    proxy_pass http://127.0.0.1:8086/gesundheit;
    access_log off;
}
