# Dienstausweis: Apache-Fassung von nginx-direktiven.conf, für Plesk-Server,
# auf denen nginx aus ist (wie srv01, neben S1-Control).
#
# Eintragen unter: Websites & Domains → <Domain> → „Apache & nginx Settings“
# → „Additional directives for HTTPS“. Voraussetzung: Zertifikat von SSL It!
# (Let's Encrypt) mit Umleitung http → https.
#
# Der Port muss zu DA_PLESK_PORT in .env passen (Vorgabe 8086).
#
# Anders als bei nginx lässt sich /wallet/ hier nicht aus dem Zugriffsprotokoll
# von Plesk nehmen: Dort stehen Pfad, IP und Zeitpunkt, nie der Rumpf.

ProxyRequests Off
ProxyPreserveHost On
# Zertifikatserneuerung (Let's Encrypt) bleibt bei Plesk.
ProxyPass /.well-known/acme-challenge !
ProxyPass / http://127.0.0.1:8086/ timeout=60 keepalive=On
ProxyPassReverse / http://127.0.0.1:8086/
# Der Dienst zählt Pässe je Absender (DA_HINTER_PROXY=1) und nimmt dafür den
# letzten Eintrag von X-Forwarded-For; den hängt mod_proxy selbst an.
RequestHeader set X-Forwarded-Proto "https"
# Ein Ausweis mit Foto bleibt unter 900 kB (MAX_ANFRAGE).
LimitRequestBody 1048576
